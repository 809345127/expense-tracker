[versions]
# AGP 用最后一个 8.x 而不是 9.4.0：9 是大版本、构建 DSL 有破坏性改动，
# 新工程先站在熟悉的地基上，等这个 app 跑起来了再单独做升级
agp = "8.13.2"
# ⚠️ Kotlin 和 KSP 必须配套。KSP 最新是 2.3.11，没有 2.4.10 那一档，
#    所以 Kotlin 取 2.3.x 的最后一个，而不是最新的 2.4.10
kotlin = "2.3.21"
ksp = "2.3.11"
# ⚠️ 不用最新的 BOM 2026.08.00（= Compose 1.12.0）。
# 那一批库要求 **compileSdk 37**，而 android-37 平台**只在 canary 预览频道里**，
# 稳定频道最高只到 36 —— 给日常在用的手机装预览 SDK 编出来的包不合适。
# 所以整体退一个版本波：BOM 2026.06.01 = Compose 1.11.4，全是正式版、且只要 compileSdk 36。
# 以后 android-37 进了稳定频道，把这一组（BOM / lifecycle / navigation / okhttp / activity）
# 连同 AGP 一起往上抬，那是一次单独的升级。
composeBom = "2026.06.01"
room = "2.8.4"
work = "2.11.2"
glance = "1.2.0"
retrofit = "3.0.0"
okhttp = "5.4.0"        # 5.5.0 要 compileSdk 37
serialization = "1.11.0"
activityCompose = "1.12.4"  # 1.13.0 会把 Compose 1.12 拖回来
lifecycle = "2.10.0"    # 2.11.0 要 compileSdk 37
navigation = "2.9.8"    # 2.10.0 要 compileSdk 37
datastore = "1.2.1"
# ⚠️ biometric 最新的**稳定版**就是 1.1.0（2021 年的，之后只有 alpha）。
# 我第一版凭记忆写了 1.4.0，那个版本不存在，构建直接失败。
# 教训：版本号一个都不许凭记忆写，全都去查 maven-metadata。
biometric = "1.1.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Kotlin 2.0 起 Compose 编译器并进了 Kotlin 插件，版本跟着 Kotlin 走
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
